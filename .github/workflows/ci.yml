name: CI & DevSecOps Pipeline

on:
  push:
    branches: [ main, test-audit, 'feat/**' ]
  pull_request:
    branches: [ main, test-audit ]

jobs:
  # ── BACKEND SECURITY & TESTING (FASTAPI) ───────────────────────────
  backend-ci:
    name: Backend CI (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install black pytest pytest-cov bandit safety

      - name: Code Formatting Check (Black)
        run: |
          black --check backend/app/ backend/tests/

      - name: SAST Security Scan (Bandit)
        run: |
          bandit -r backend/app/ -ll -ii

      - name: SCA Dependency Vulnerability Check (Safety)
        run: |
          # Safety checks requirements for known vulnerabilities
          # Ignore non-zero exit in prototype demo, or strictly enforce it
          safety check -r backend/requirements.txt || echo "Warnings found in dependency scan"

      - name: Run Unit & Integration Tests (Pytest)
        run: |
          python -m pytest backend/tests/ -v --cov=backend/app/ --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          DB_USER: "test"
          DB_PASSWORD: "test"
          JWT_SECRET_KEY: "SuperSecretKeyForCITestsOnly12345!"

  # ── FRONTEND BUILD & LINTING (REACT) ───────────────────────────────
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint Linter
        run: |
          cd frontend
          npm run lint

      - name: SCA Dependency Audit (NPM Audit)
        run: |
          cd frontend
          npm audit --audit-level=moderate || echo "Audit warnings found, check details"

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build
